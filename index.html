const protectNativeTextEntry = () => {
  const selector = 'input, textarea, select';
  const isTargetInput = (node) => !!node && node.matches && node.matches(selector) && !node.disabled && !node.closest('[hidden]');

  document.addEventListener('click', (event) => {
    const target = event.target;
    const input = target && target.closest ? target.closest(selector) : null;
    if (!isTargetInput(input)) return;
    const active = document.activeElement;
    if (active !== input) {
      requestAnimationFrame(() => {
        if (document.activeElement !== input && !input.matches(':disabled')) {
          input.focus({ preventScroll: true });
        }
      });
    }
  });

  document.addEventListener('focusin', (event) => {
    const target = event.target;
    if (!isTargetInput(target)) return;
    target.setAttribute('data-native-input', 'true');
  });
};

const formatRelativeTime = (dateValue) => {
  const timestamp = Date.parse(dateValue || '');
  if (!Number.isFinite(timestamp)) return 'Recently';
  const elapsedSeconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
  if (elapsedSeconds < 60) return 'Just now';
  const units = [[31536000, 'year'], [2592000, 'month'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
  const [unitSeconds, unitName] = units.find(([seconds]) => elapsedSeconds >= seconds) || [1, 'second'];
  const value = Math.floor(elapsedSeconds / unitSeconds);
  return `${value} ${unitName}${value === 1 ? '' : 's'} ago`;
};

const sanitizeText = (value) => (typeof value === 'string' ? value.trim() : '');
const normalizeLanguageName = (language) => {
  const value = sanitizeText(language);
  const shortcuts = { en: 'English', eng: 'English', ta: 'Tamil', tam: 'Tamil', te: 'Telugu', tel: 'Telugu', hi: 'Hindi', hin: 'Hindi' };
  return shortcuts[value.toLowerCase()] || value;
};
const normalizeListingForDisplay = (listing) => {
  if (!listing || typeof listing !== 'object') return null;
  const title = sanitizeText(listing.title);
  const location = sanitizeText(listing.location);
  const description = sanitizeText(listing.description);
  const size = sanitizeText(listing.size);
  const price = Number(listing.price) || 0;
  const features = Array.isArray(listing.features)
    ? listing.features.map(item => sanitizeText(item)).filter(Boolean)
    : [];

  return {
    ...listing,
    title,
    location,
    description,
    size,
    price,
    features,
    plotCount: listing.type === 'Plot' ? Math.max(0, Number(listing.plotCount) || 0) : 0,
    images: Array.isArray(listing.images) && listing.images.length > 0 ? listing.images : [listing.image || DEFAULT_PROPERTY_IMAGE],
    languages: Array.isArray(listing.languages) && listing.languages.length > 0
      ? listing.languages.map(normalizeLanguageName).filter(Boolean)
      : (listing.isUserListing ? [] : ['English']),
    contact: {
      phone: sanitizeText(listing.contact?.phone),
      whatsapp: sanitizeText(listing.contact?.whatsapp),
      email: sanitizeText(listing.contact?.email),
      website: sanitizeText(listing.contact?.website),
    },
    plotDetails: listing.plotDetails ? {
      zoning: sanitizeText(listing.plotDetails.zoning),
      titleStatus: sanitizeText(listing.plotDetails.titleStatus),
      access: sanitizeText(listing.plotDetails.access),
      utilities: sanitizeText(listing.plotDetails.utilities),
      soil: sanitizeText(listing.plotDetails.soil),
    } : null,
  };
};
const hasDisplayableListingData = (listing) => {
  if (!listing || typeof listing !== 'object') return false;
  return !!(
    sanitizeText(listing.title) ||
    sanitizeText(listing.location) ||
    sanitizeText(listing.description) ||
    sanitizeText(listing.size) ||
    Number(listing.price) > 0 ||
    (Array.isArray(listing.features) && listing.features.some(item => sanitizeText(item)))
  );
};

const readImageAsDataUrl = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    const image = new Image();
    image.onload = () => {
      const maxDimension = 1600;
      const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext('2d');
      if (!context) {
        resolve(reader.result);
        return;
      }
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.78));
    };
    image.onerror = () => reject(new Error('Failed to decode image file'));
    image.src = reader.result;
  };
  reader.onerror = () => reject(new Error('Failed to read image file'));
  reader.readAsDataURL(file);
});
const readFilesAsDataUrls = (files) => Promise.all(Array.from(files || []).filter(file => file && file.type && file.type.startsWith('image/')).slice(0, 5).map(readImageAsDataUrl));

// ─── AUTH CONTEXT ──────────────────────────────────────────
const AuthContext = createContext(null);
const AuthProvider = ({ children }) => {
  const [user, setUser] = useState(null);
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [isLoading, setIsLoading] = useState(true);

  const hydrateSupabaseUser = async (authUser) => {
    if (!authUser) {
      setUser(null);
      setIsAuthenticated(false);
      return null;
    }
    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', authUser.id)
      .maybeSingle();
    if (error) throw error;
    const userData = {
      id: authUser.id,
      email: authUser.email || profile?.email || '',
      name: profile?.name || authUser.user_metadata?.name || authUser.email?.split('@')[0] || 'User',
      avatar: profile?.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile?.name || authUser.email || 'User')}&background=7C3AED&color=fff&bold=true&size=80`,
      joinedAt: profile?.created_at || authUser.created_at,
      ...profile,
    };
    setUser(userData);
    setIsAuthenticated(true);
    return userData;
  };

  useEffect(() => {
    if (!supabaseClient) {
      const storedUser = localStorage.getItem('clay_user');
      if (storedUser) {
        try {
          const parsed = JSON.parse(storedUser);
          setUser(parsed);
          setIsAuthenticated(true);
        } catch { localStorage.removeItem('clay_user'); }
      }
      setIsLoading(false);
      return undefined;
    }

    let isMounted = true;
    supabaseClient.auth.getSession().then(async ({ data, error }) => {
      if (error) return;
      if (data.session && isMounted) {
        try { await hydrateSupabaseUser(data.session.user); } catch { setUser(null); setIsAuthenticated(false); }
      }
      if (isMounted) setIsLoading(false);
    });
    const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (!session) {
        setUser(null);
        setIsAuthenticated(false);
        return;
      }
      setTimeout(() => hydrateSupabaseUser(session.user).catch(() => {
        setUser(null);
        setIsAuthenticated(false);
      }), 0);
    });
    return () => {
      isMounted = false;
      authListener.subscription.unsubscribe();
    };
  }, []);

  const login = async (email, password) => {
    const normalizedEmail = (email || '').trim();
    const normalizedPassword = (password || '').trim();

    if (!normalizedEmail || !normalizedPassword) return { success: false, error: 'Email and password are required.' };
    if (!isValidEmail(normalizedEmail)) return { success: false, error: 'Please enter a valid email address.' };
    if (normalizedPassword.length < 8) return { success: false, error: 'Password must be at least 8 characters.' };

    if (supabaseClient) {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: normalizedEmail, password: normalizedPassword });
      if (error) return { success: false, error: error.message };
      try {
        const userData = await hydrateSupabaseUser(data.user);
        return { success: true, user: userData };
      } catch (profileError) {
        return { success: false, error: profileError.message || 'Your account profile could not be loaded.' };
      }
    }

    if (normalizedEmail.toLowerCase() === DEMO_ACCOUNT.email.toLowerCase() && normalizedPassword === DEMO_ACCOUNT.password) {
      const userData = {
        id: 'demo_user',
        email: DEMO_ACCOUNT.email,
        name: DEMO_ACCOUNT.name,
        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(DEMO_ACCOUNT.name)}&background=7C3AED&color=fff&bold=true&size=80`,
        joinedAt: new Date().toISOString(),
      };
      localStorage.setItem('clay_user', JSON.stringify(userData));
      setUser(userData);
      setIsAuthenticated(true);
      return { success: true, user: userData };
    }

    const userData = {
      id: 'user_' + Date.now(),
      email: normalizedEmail,
      name: normalizedEmail.split('@')[0].replace(/[^a-zA-Z0-9]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
      avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(normalizedEmail.split('@')[0])}&background=7C3AED&color=fff&bold=true&size=80`,
      joinedAt: new Date().toISOString(),
    };
    localStorage.setItem('clay_user', JSON.stringify(userData));
    setUser(userData);
    setIsAuthenticated(true);
    return { success: true, user: userData };
  };

  const signup = async (name, email, password) => {
    if (!name || !email || !password) {
      return { success: false, error: 'Please fill all fields.' };
    }
    if (name.trim().length < 2) {
      return { success: false, error: 'Name must be at least 2 characters.' };
    }
    if (!isValidEmail(email)) {
      return { success: false, error: 'Please enter a valid email address.' };
    }
    if (password.length < 8) {
      return { success: false, error: 'Password must be at least 8 characters.' };
    }
    if (supabaseClient) {
      const { data, error } = await supabaseClient.auth.signUp({ email: email.trim(), password, options: { data: { name: name.trim() } } });
      if (error) return { success: false, error: error.message };
      if (!data.user) return { success: false, error: 'Your account could not be created.' };
      if (!data.session) {
        return {
          success: true,
          requiresEmailConfirmation: true,
          user: { name: name.trim(), email: email.trim() },
        };
      }
      const { error: profileError } = await supabaseClient.from('profiles').upsert({ id: data.user.id, name: name.trim(), email: email.trim(), languages: [] });
      if (profileError) return { success: false, error: profileError.message };
      try {
        const userData = await hydrateSupabaseUser(data.user);
        return { success: true, user: userData };
      } catch (profileError) {
        return { success: false, error: profileError.message || 'Your account profile could not be created.' };
      }
    }
    const userData = {
      id: 'user_' + Date.now(),
      name: name.trim(),
      email,
      avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=7C3AED&color=fff&bold=true&size=80`,
      joinedAt: new Date().toISOString(),
    };
    localStorage.setItem('clay_user', JSON.stringify(userData));
    setUser(userData);
    setIsAuthenticated(true);
    return { success: true, user: userData };
  };

  const logout = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    localStorage.removeItem('clay_user');
    setUser(null);
    setIsAuthenticated(false);
    // Favorites will be cleared by the App component's effect
  };

  const updateProfile = async (profile) => {
    if (!user) return { success: false, error: 'You must be signed in to update your profile.' };
    if (supabaseClient) {
      const { error } = await supabaseClient.from('profiles').update({ ...profile, email: user.email }).eq('id', user.id);
      if (error) return { success: false, error: error.message };
    }
    const updatedUser = { ...user, ...profile };
    localStorage.setItem('clay_user', JSON.stringify(updatedUser));
    setUser(updatedUser);
    return { success: true, user: updatedUser };
  };

  return (
    <AuthContext.Provider value={{ user, isAuthenticated, isLoading, login, signup, logout, updateProfile }}>
      {children}
    </AuthContext.Provider>
  );
};
const useAuth = () => useContext(AuthContext);

            </div>
            <p className="text-clay-muted text-base sm:text-lg font-medium mb-6 sm:mb-8">Manage your saved properties, listings, and account activity.</p>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8">
            {[{ icon:'❤️', label:'Saved Properties', value:favCount }, { icon:'💰', label:'Total Value', value:formatPrice(totalValue) }, { icon:'📌', label:'Your Listings', value:myListings.length }, { icon:'📬', label:'Messages', value:'3' }].map((s, i) => (
              <div key={i} className={`clay-card p-4 sm:p-6 text-center rounded-[24px] reveal reveal-delay-${i+1}`}>
                <div className="text-2xl sm:text-3xl">{s.icon}</div>
                <div className="font-nunito font-black text-xl sm:text-2xl">{s.value}</div>
                <div className="text-xs sm:text-sm text-clay-muted font-medium">{s.label}</div>
              </div>
            ))}
          </div>
          {myListings.length > 0 && (
            <div className="clay-card p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] mb-6 reveal">
              <div className="flex items-center justify-between mb-4"><h3 className="font-nunito font-extrabold text-xl sm:text-2xl text-clay-foreground">📌 Your Listings</h3><button onClick={() => setShowListForm(true)} className="clay-btn clay-btn-primary text-sm clay-btn-sm"><Icons.Plus className="w-4 h-4 mr-1.5" /> New</button></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {myListings.map((p, idx) => (
                  <div key={p.id} className={`clay-card p-3 sm:p-4 rounded-[20px] sm:rounded-[24px] cursor-pointer hover:shadow-clay-card-hover hover:-translate-y-1 transition-all reveal reveal-delay-${(idx % 3) + 1}`} onClick={() => { setSelectedProperty(p); setCurrentPage('detail'); }}>
                    <img src={p.image} alt={p.title} className="w-full aspect-[16/10] object-cover rounded-[16px]" />
                    <div className="mt-3"><div className="font-nunito font-bold text-sm sm:text-base line-clamp-1">{p.title}</div><div className="text-sm font-bold text-[#7C3AED]">{formatPrice(p.price)}</div><div className="text-xs text-clay-muted">{p.location}</div></div>
                    <div className="mt-3 flex gap-2">
                      <button onClick={(e) => {
                        e.stopPropagation();
                        setEditingListingId(p.id);
                        setListingForm({
                          title: p.title,
                          location: p.location,
                          price: String(p.price),
                          size: p.size,
                          type: p.type || 'Residential',
                          description: p.description,
                          plotCount: p.plotCount || '',
                          image: p.image,
                          images: p.images || [p.image].filter(Boolean),
                          features: (p.features || []).join(', '),
                          plotDetails: p.plotDetails || { zoning: '', titleStatus: '', access: '', utilities: '', soil: '' }
                        });
                        setShowListForm(true);
                      }} className="text-xs font-bold text-[#7C3AED] hover:text-[#5B3CC5] transition-colors">Edit</button>
                      <button onClick={(e) => { e.stopPropagation(); deleteUserListing(p.id); }} className="text-xs font-bold text-red-500 hover:text-red-600 transition-colors">Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div className="clay-card p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] reveal">
            <h3 className="font-nunito font-extrabold text-xl sm:text-2xl text-clay-foreground mb-4">❤️ Saved Properties</h3>
            {favProperties.length === 0 ? (
              <div className="text-center py-8 sm:py-12"><div className="text-5xl mb-3">🏡</div><p className="text-clay-muted font-medium">You haven't saved any properties yet.</p><button onClick={() => setCurrentPage('listings')} className="clay-btn clay-btn-primary mt-4 text-sm">Browse Listings</button></div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {favProperties.map((p, idx) => (
                  <div key={p.id} className={`clay-card p-3 sm:p-4 rounded-[20px] sm:rounded-[24px] cursor-pointer hover:shadow-clay-card-hover hover:-translate-y-1 transition-all reveal reveal-delay-${(idx % 3) + 1}`} onClick={() => { setSelectedProperty(p); setCurrentPage('detail'); }}>
                    <img src={p.image} alt={p.title} className="w-full aspect-[16/10] object-cover rounded-[16px]" />
                    <div className="mt-3"><div className="font-nunito font-bold text-sm sm:text-base line-clamp-1">{p.title}</div><div className="text-sm font-bold text-[#7C3AED]">{formatPrice(p.price)}</div><div className="text-xs text-clay-muted">{p.location}</div></div>
                    <button onClick={(e) => { e.stopPropagation(); toggleFavorite(p.id); }} className="mt-2 text-xs font-bold text-[#DB2777] hover:underline">Remove</button>
                  </div>
                ))}
              </div>
            )}
          </div>
          {/* ─── QUICK ACTIONS (FIXED) ─── */}
          <div className="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            {[
              { icon: '📝', label: 'List Property', action: () => setShowListForm(true) },
              { icon: '🧮', label: 'Mortgage Calc', action: () => setShowMortgage(true) },
              { icon: '📊', label: 'Market Insights', action: () => showToast('Market insights coming soon!', 'info') },
              { icon: '💬', label: 'Messages', action: () => showToast('Messages feature coming soon!', 'info') },
            ].map((s, i) => (
              <button key={i} onClick={s.action} className={`clay-card p-4 text-center hover:shadow-clay-card-hover hover:-translate-y-1 transition-all reveal reveal-delay-${i + 1}`}>
                <div className="text-2xl">{s.icon}</div>
                <div className="text-sm font-bold mt-1">{s.label}</div>
              </button>
            ))}
          </div>
          <div className="mt-6 clay-card p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] reveal">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
              <h3 className="font-nunito font-extrabold text-xl sm:text-2xl text-clay-foreground">👤 Account</h3>
              <button onClick={() => setIsProfileEditing(!isProfileEditing)} className="clay-btn clay-btn-outline clay-btn-sm text-sm">{isProfileEditing ? 'Close' : 'Edit Profile'}</button>
            </div>
            {isProfileEditing ? (
              <form id="profile-form" onFocusCapture={() => { profileScrollY.current = window.scrollY; }} onSubmit={(event) => { event.preventDefault(); saveProfile(event); }} onKeyDown={(event) => { if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA') event.preventDefault(); }} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="form-group md:col-span-3 flex flex-col sm:flex-row sm:items-center gap-4 rounded-[20px] bg-white/50 p-4">
                  <div className="user-avatar w-20 h-20 text-2xl flex-shrink-0">
                    {profileForm.avatar ? <img src={profileForm.avatar} alt="Profile preview" /> : getInitials(profileForm.name || 'User')}
                  </div>
                  <div className="flex-1">
                    <label htmlFor="profile-avatar">Profile picture</label>
                    <input id="profile-avatar-camera" ref={profileCameraInput} type="file" accept="image/*" capture="user" onChange={handleProfileImageChange} className="sr-only" />
                    <input id="profile-avatar-gallery" ref={profileGalleryInput} type="file" accept="image/*" onChange={handleProfileImageChange} className="sr-only" />
                    <div className="flex flex-col sm:flex-row gap-2 mt-2">
                      <button type="button" onClick={() => profileCameraInput.current?.click()} className="clay-btn clay-btn-outline clay-btn-sm text-sm w-full sm:w-auto">📷 Camera</button>
                      <button type="button" onClick={() => profileGalleryInput.current?.click()} className="clay-btn clay-btn-secondary clay-btn-sm text-sm w-full sm:w-auto">🖼️ Gallery</button>
                    </div>
                    <p className="text-xs text-clay-muted mt-2">Take a new photo or choose one from your device.</p>
                  </div>
                </div>
                <div className="form-group"><label htmlFor="profile-name">Full name</label><input id="profile-name" type="text" value={profileForm.name} onChange={(e) => setProfileForm(prev => ({ ...prev, name: e.target.value }))} className="clay-input h-14 text-base" placeholder="Your full name" required /></div>
                <div className="form-group md:col-span-2"><label htmlFor="profile-address">Street address</label><input id="profile-address" type="text" value={profileForm.address} onChange={(e) => setProfileForm(prev => ({ ...prev, address: e.target.value }))} className="clay-input h-14 text-base" placeholder="Street and building number" /></div>
                <div className="form-group"><label htmlFor="profile-city">City</label><input id="profile-city" type="text" value={profileForm.city} onChange={(e) => setProfileForm(prev => ({ ...prev, city: e.target.value }))} className="clay-input h-14 text-base" placeholder="City" /></div>
                <div className="form-group"><label htmlFor="profile-state">State / region</label><input id="profile-state" type="text" value={profileForm.state} onChange={(e) => setProfileForm(prev => ({ ...prev, state: e.target.value }))} className="clay-input h-14 text-base" placeholder="State or region" /></div>
                <div className="form-group"><label htmlFor="profile-postal-code">Postal code</label><input id="profile-postal-code" type="text" value={profileForm.postalCode} onChange={(e) => setProfileForm(prev => ({ ...prev, postalCode: e.target.value }))} className="clay-input h-14 text-base" placeholder="Postal code" /></div>
                <div className="form-group"><label htmlFor="profile-phone">Contact number</label><input id="profile-phone" type="tel" value={profileForm.phone} onChange={(e) => setProfileForm(prev => ({ ...prev, phone: e.target.value }))} className="clay-input h-14 text-base" placeholder="+1 (555) 123-4567" /></div>
                <div className="form-group"><label htmlFor="profile-whatsapp">WhatsApp number</label><input id="profile-whatsapp" type="tel" value={profileForm.whatsapp} onChange={(e) => setProfileForm(prev => ({ ...prev, whatsapp: e.target.value }))} className="clay-input h-14 text-base" placeholder="+1 (555) 123-4567" /></div>
                <div className="form-group"><label htmlFor="profile-preferred-contact">Preferred contact</label><select id="profile-preferred-contact" value={profileForm.preferredContact} onChange={(e) => setProfileForm(prev => ({ ...prev, preferredContact: e.target.value }))}><option>Phone</option><option>WhatsApp</option><option>Email</option></select></div>
                <div className="form-group md:col-span-3"><label htmlFor="profile-bio">About you</label><textarea id="profile-bio" value={profileForm.bio} onChange={(e) => setProfileForm(prev => ({ ...prev, bio: e.target.value }))} className="min-h-[100px]" placeholder="Tell buyers or sellers a little about yourself" maxLength="240" /></div>
                <div className="form-group md:col-span-3"><label htmlFor="profile-languages">Known languages</label><input id="profile-languages" type="text" value={profileForm.languages} onChange={(e) => setProfileForm(prev => ({ ...prev, languages: e.target.value }))} className="clay-input h-14 text-base" placeholder="Enter languages separated by commas, for example: English, Tamil, Telugu, Hindi" /></div>
                <div className="flex items-end gap-2 md:col-span-3"><button type="submit" className="clay-btn clay-btn-primary clay-btn-sm text-sm flex-1">Save Information</button><button type="button" onClick={() => setIsProfileEditing(false)} className="clay-btn clay-btn-secondary clay-btn-sm text-sm">Cancel</button></div>
              </form>
            ) : (
              <div className="flex flex-col lg:flex-row lg:items-start gap-4 sm:gap-6">
                <div className="flex items-center gap-4 min-w-[220px]">
                  <div className="user-avatar w-16 h-16 text-xl">{user?.avatar ? <img src={user.avatar} alt={`${user?.name || 'User'} profile`} /> : getInitials(user?.name || 'User')}</div>
                  <div><div className="font-nunito font-bold text-lg text-clay-foreground">{user?.name}</div><div className="text-sm text-clay-muted">{user?.email}</div><div className="text-xs text-clay-muted mt-1">Joined {new Date(user?.joinedAt).toLocaleDateString()}</div></div>
                </div>
                <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
                  <div className="bg-white/50 rounded-[18px] p-3 sm:col-span-2"><div className="text-xs font-bold text-clay-muted uppercase">Address</div><div className="font-medium mt-1">{[user?.address, user?.city, user?.state, user?.postalCode].filter(Boolean).join(', ') || 'Not added'}</div></div>
                  <div className="bg-white/50 rounded-[18px] p-3"><div className="text-xs font-bold text-clay-muted uppercase">Contact</div>{user?.phone ? <a href={`tel:${user.phone.replace(/[^\d+]/g, '')}`} className="font-medium mt-1 block hover:text-[#7C3AED]">{user.phone}</a> : <div className="font-medium mt-1">Not added</div>}</div>
                  <div className="bg-white/50 rounded-[18px] p-3"><div className="text-xs font-bold text-clay-muted uppercase">WhatsApp</div>{user?.whatsapp ? <a href={`https://wa.me/${user.whatsapp.replace(/[^\d]/g, '')}`} target="_blank" rel="noreferrer" className="font-medium mt-1 block text-[#10B981] hover:underline">Message on WhatsApp</a> : <div className="font-medium mt-1">Not added</div>}</div>
                  <div className="bg-white/50 rounded-[18px] p-3 sm:col-span-2"><div className="text-xs font-bold text-clay-muted uppercase">About</div><div className="font-medium mt-1">{user?.bio || 'Add a short profile description'}</div></div>
                  <div className="bg-white/50 rounded-[18px] p-3"><div className="text-xs font-bold text-clay-muted uppercase">Preferred contact</div><div className="font-medium mt-1">{user?.preferredContact || 'Phone'}</div></div>
                  <div className="bg-white/50 rounded-[18px] p-3 sm:col-span-2"><div className="text-xs font-bold text-clay-muted uppercase">Known languages</div><div className="font-medium mt-1">{user?.languages?.length ? user.languages.join(', ') : 'Not added'}</div></div>
                </div>
                <button onClick={() => { logout(); setCurrentPage('home'); showToast('Signed out successfully.', 'info'); }} className="clay-btn clay-btn-outline text-sm"><Icons.LogOut className="w-4 h-4 mr-1.5" /> Sign Out</button>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  // ─── PAGE RENDERER ──────────────────────────────────────
  const renderPage = () => {
    switch (currentPage) {
      case 'home': return <><Hero /><FeaturedListings /><HowItWorks /><TestimonialsSection /><RecentActivity /></>;
      case 'listings': return <ListingsPage />;
      case 'detail': return <DetailPage property={selectedProperty} onBack={() => setCurrentPage('listings')} />;
      case 'dashboard': return <Dashboard />;
      default: return <Hero />;
    }
  };

  // ─── APP ────────────────────────────────────────────────
  if (isLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center"><div className="w-16 h-16 rounded-full bg-gradient-to-br from-[#A78BFA] to-[#7C3AED] animate-clay-breathe shadow-clay-button mx-auto" /><p className="text-clay-muted font-medium mt-4">Loading...</p></div>
      </div>
    );
  }

  return (
    <div className="min-h-screen relative">
      <Blobs />
      <Nav />
      <main className="relative z-10">{renderPage()}</main>
      <Footer />
      <MortgageModal isOpen={showMortgage} onClose={() => setShowMortgage(false)} />
      <AuthModal />
      <ListingFormModal />
      <Toast />
    </div>
  );
}

// ─── WRAP WITH AUTH PROVIDER ────────────────────────────
function Root() {
  return (
    <AuthProvider>
      <App />
    </AuthProvider>
  );
}

// ─── MOUNT ────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
